<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Checkout — VoltCart</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">VoltCart</a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="shop.html">Shop</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="cart-icon-btn" title="Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-badge" id="cart-count">0</span>
        </a>
        <a href="profile.html" class="user-icon-btn" title="Account">
          <i class="fa-solid fa-user"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Checkout Main Content -->
  <main class="container" style="padding: 3rem 2rem; max-width: 800px;">
    <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 2rem;">Secure Checkout</h1>

    <div id="checkout-container" style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; box-shadow: var(--shadow);">
      <form id="checkout-form">
        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem;">Shipping Address</h2>
        
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.875rem;">Street Address</label>
          <input type="text" id="shipping-address" required placeholder="e.g. 123 Main Street" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
          <div class="form-group">
            <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.875rem;">City</label>
            <input type="text" id="shipping-city" required placeholder="e.g. Lagos" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px;">
          </div>
          <div class="form-group">
            <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.875rem;">Postal Code</label>
            <input type="text" id="shipping-postal" required placeholder="e.g. 100001" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px;">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.875rem;">Country</label>
          <input type="text" id="shipping-country" required placeholder="e.g. Nigeria" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px;">
        </div>

        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem;">Payment Method</h2>
        <div style="margin-bottom: 2rem; display: flex; gap: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 600; cursor: pointer;">
            <input type="radio" name="paymentMethod" value="Card" checked> Credit / Debit Card (Simulated Secure)
          </label>
        </div>

        <div id="checkout-error" style="color: var(--danger); font-size: 0.875rem; margin-bottom: 1rem; display: none;"></div>

        <button type="submit" class="btn-primary" id="place-order-btn" style="width: 100%; text-align: center; border: none; cursor: pointer;">Place Order Securely</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer style="background-color: var(--surface); border-top: 1px solid var(--border); padding: 3rem 0; text-align: center; color: var(--text-muted); margin-top: 4rem;">
    <div class="container">
      <p>&copy; 2026 VoltCart. Built with Node.js, Express, MongoDB & Vanilla JS.</p>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/checkout.js"></script>
</body>
</html>
