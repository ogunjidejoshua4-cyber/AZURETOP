<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile & Orders — VoltCart</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">VoltCart</a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="shop.html">Shop</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="cart-icon-btn" title="Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-badge" id="cart-count">0</span>
        </a>
        <a href="profile.html" class="user-icon-btn active" title="Account">
          <i class="fa-solid fa-user"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Profile Main Content -->
  <main class="container" style="padding: 3rem 2rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 style="font-size: 2rem; font-weight: 700;">Customer Dashboard</h1>
      <button id="logout-btn" style="background: var(--danger); color: white; padding: 0.6rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none;">Sign Out</button>
    </div>

    <!-- Profile Information Card -->
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; margin-bottom: 2.5rem; box-shadow: var(--shadow);">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem;">Profile Information</h2>
      <div id="profile-info" style="color: var(--text-muted); font-size: 0.95rem;">
        <p>Loading profile details...</p>
      </div>
    </div>

    <!-- Order History Section -->
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; box-shadow: var(--shadow);">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem;">Your Order History</h2>
      <div id="orders-container">
        <p style="color: var(--text-muted);">Loading your past orders...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer style="background-color: var(--surface); border-top: 1px solid var(--border); padding: 3rem 0; text-align: center; color: var(--text-muted); margin-top: 4rem;">
    <div class="container">
      <p>&copy; 2026 VoltCart. Built with Node.js, Express, MongoDB & Vanilla JS.</p>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
