<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Products — VoltCart</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">VoltCart</a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="cart-icon-btn" title="Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-badge" id="cart-count">0</span>
        </a>
        <a href="profile.html" class="user-icon-btn" title="Account">
          <i class="fa-solid fa-user"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Shop Main Content -->
  <main class="container" style="padding: 3rem 2rem;">
    <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 2rem;">Shop All Products</h1>
    
    <!-- Filters Bar -->
    <div style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
      <input type="text" id="search-input" placeholder="Search products..." style="padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; flex: 1; min-width: 250px; font-family: inherit;">
      <select id="category-filter" style="padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-family: inherit;">
        <option value="">All Categories</option>
      </select>
    </div>

    <!-- Products Grid -->
    <div id="shop-products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;">
      <p style="color: var(--text-muted);">Loading products...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer style="background-color: var(--surface); border-top: 1px solid var(--border); padding: 3rem 0; text-align: center; color: var(--text-muted); margin-top: 4rem;">
    <div class="container">
      <p>&copy; 2026 VoltCart. Built with Node.js, Express, MongoDB & Vanilla JS.</p>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/shop.js"></script>
</body>
</html>
